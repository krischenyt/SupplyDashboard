<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Supply 庫存與發貨看板</title>
<style>
:root{--bg:#f5f6f4;--panel:#fff;--ink:#1d2421;--mute:#69736e;--line:#dde2de;--accent:#0f6b5c;--accent-ink:#fff;--warn:#b4570a;--warn-bg:#fdf0e1;--bad:#b3261e;--bad-bg:#fbe9e7;--ok:#1f7a45;--ok-bg:#e5f4ea}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151a18;--panel:#1d2421;--ink:#e8ece9;--mute:#97a39d;--line:#2f3935;--accent:#4cc3ad;--accent-ink:#0b1210;--warn:#f0a35a;--warn-bg:#35291a;--bad:#f28b82;--bad-bg:#3a2321;--ok:#6fd194;--ok-bg:#1b3125}}
:root[data-theme="dark"]{--bg:#151a18;--panel:#1d2421;--ink:#e8ece9;--mute:#97a39d;--line:#2f3935;--accent:#4cc3ad;--accent-ink:#0b1210;--warn:#f0a35a;--warn-bg:#35291a;--bad:#f28b82;--bad-bg:#3a2321;--ok:#6fd194;--ok-bg:#1b3125}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;padding:0 20px 40px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:20px 0 12px}
h1{font-size:20px;margin:0;font-weight:700}
.sub{color:var(--mute);font-size:12px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input,select,button,textarea{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 10px}
button{cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:8px 0 16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px}
.kpi b{display:block;font-size:24px;line-height:1.2}
.kpi span{color:var(--mute);font-size:12px}
.kpi.hot b{color:var(--warn)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:12px}
.tabs button{border:0;border-bottom:3px solid transparent;border-radius:0;background:none;padding:8px 14px;color:var(--mute)}
.tabs button.on{color:var(--ink);border-color:var(--accent);font-weight:700}
.badge{display:inline-block;min-width:20px;padding:0 6px;border-radius:10px;background:var(--warn-bg);color:var(--warn);font-size:12px;text-align:center;margin-left:4px}
.wrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;min-width:900px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{position:sticky;top:0;background:var(--panel);font-weight:600;color:var(--mute);cursor:pointer;white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.ship td{background:var(--warn-bg)}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;white-space:nowrap}
.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.ok{background:var(--ok-bg);color:var(--ok)}
.title{max-width:280px}.title a{color:var(--ink);text-decoration:none;border-bottom:1px dotted var(--mute)}
.title small{display:block;color:var(--mute)}
textarea{width:100%;min-width:200px;height:34px;resize:vertical}
.note{background:var(--warn-bg);color:var(--warn);border-radius:6px;padding:8px 12px;margin-bottom:12px;font-size:12px}
.empty{padding:40px;text-align:center;color:var(--mute)}
.meta{color:var(--mute);font-size:12px}
</style>
</head>

<header>
  <div>
    <h1>Supply 庫存與發貨看板</h1>
    <div class="sub" id="stamp"></div>
  </div>
  <div class="tools">
    <input id="who" placeholder="你的名字" size="9" aria-label="你的名字">
    <button id="themeBtn" title="切換深色/淺色">◐</button>
    <button id="upBtn">匯入 Excel/CSV</button>
    <button id="dlBtn">匯出 data.json</button>
    <input type="file" id="file" accept=".xlsx,.xls,.csv" hidden>
  </div>
</header>

<div id="syncNote" class="note" hidden>目前沒有設定共用後端：備註與「已發貨」只存在這台瀏覽器，其他人看不到。請依 README 設定 SYNC_URL。</div>
<div class="kpis" id="kpis"></div>

<div class="tabs" id="tabs">
  <button data-t="all" class="on">全部產品</button>
  <button data-t="ship">需發貨<span class="badge" id="bShip">0</span></button>
  <button data-t="done">已發貨紀錄</button>
</div>
<div class="tools" style="margin-bottom:10px">

  <select id="brand"><option value="">全部品牌</option></select>
  <label><input type="checkbox" id="low"> 只看低庫存（可售 &lt; 30 天）</label>
</div>
<div class="wrap"><table id="tbl"></table></div>

  if (p.done === false) { s.doneAt = ""; s.doneBy = ""; }
  ls("state", state);
  if (SYNC_URL) fetch(SYNC_URL, {method: "POST", mode: "no-cors", headers: {"Content-Type": "text/plain"}, body: JSON.stringify({asin, patch: state[asin], info: (() => { const r = data.find(x => x.asin === asin) || {}; return {brand: r.brand, title: r.title, event: p.ship && p.qty !== undefined ? "ship" : p.done === true ? "done" : ""}; })()})}).catch(() => {});
}

// ===== 匯入 Excel =====
const ALIAS = {brand:["brand","品牌"], asin:["asin"], msku:["msku","sku","seller sku"], title:["title","name","品名","商品","產品","产品"], stock:["stock","inventory","庫存","库存","可售"], inbound:["inbound","在途","入庫中"], sales30:["sales30","30天銷量","30天销量","30d units","units"], price:["price","價格","价格"]};
function mapRow(o) {
  const keys = Object.keys(o), r = {};
  for (const f in ALIAS) { const k = keys.find(k => ALIAS[f].some(a => k.trim().toLowerCase().includes(a))); if (k) r[f] = o[k]; }
  ["stock","inbound","sales30","price"].forEach(f => { if (f in r) r[f] = num(r[f]); });
  return r;
}
$("#upBtn").onclick = () => $("#file").click();
$("#file").onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  const wb = XLSX.read(await f.arrayBuffer());
  const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {defval: ""});
  const idx = new Map(data.map(r => [r.asin, r])); let n = 0;
  rows.map(mapRow).filter(r => r.asin).forEach(r => { const old = idx.get(r.asin); if (old) Object.assign(old, r); else { data.push(Object.assign({brand:"",msku:"",title:r.asin,stock:null,inbound:null,sales30:0,price:0}, r)); } n++; });
  data.forEach(enrich);
  $("#stamp").textContent = "已用 " + f.name + " 更新 " + n + " 筆（依 ASIN 合併，尚未發布）：按「匯出 data.json」後上傳到 GitHub";
  fillBrands(); render();
};
$("#dlBtn").onclick = () => {
  const out = JSON.stringify({updated: new Date().toISOString().slice(0, 10), rows: data.map(({daily, days, ...r}) => r)}, null, 1);
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([out], {type: "application/json"})); a.download = "data.json"; a.click();
};

// ===== 畫面 =====
function fillBrands() { $("#brand").innerHTML = '<option value="">全部品牌</option>' + [...new Set(data.map(r => r.brand))].filter(Boolean).sort().map(b => `<option>${esc(b)}</option>`).join(""); }
const pill = d => d >= 99999 ? '<span class="meta">—</span>' : d >= 9999 ? '<span class="pill ok">無銷量</span>' : `<span class="pill ${d < 14 ? "bad" : d < LOW_DAYS ? "warn" : "ok"}">${d} 天</span>`;

function render() {
  const st = a => state[a] || {};
  const shipList = data.filter(r => st(r.asin).ship && !st(r.asin).done);
  const doneList = data.filter(r => st(r.asin).done);
  $("#bShip").textContent = shipList.length;
  const low = data.filter(r => r.days < LOW_DAYS).length;
  $("#kpis").innerHTML = [
    ["產品數", data.length], ["低庫存（< " + LOW_DAYS + " 天）", low, low ? "hot" : ""],
    ["待發貨", shipList.length, shipList.length ? "hot" : ""], ["待發貨總量", shipList.reduce((s, r) => s + (st(r.asin).qty || 0), 0)],
    ["30 天總銷量", data.reduce((s, r) => s + r.sales30, 0)]
  ].map(k => `<div class="kpi ${k[2] || ""}"><b>${k[1].toLocaleString()}</b><span>${k[0]}</span></div>`).join("");

  let list = tab === "ship" ? shipList : tab === "done" ? doneList : data;
  const q = $("#q").value.trim().toLowerCase(), b = $("#brand").value;
  list = list.filter(r => (!b || r.brand === b) && (!q || [r.asin, r.msku, r.title].join(" ").toLowerCase().includes(q)) && (!$("#low").checked || r.days < LOW_DAYS));
  list = [...list].sort((x, y) => ((x[sortKey] > y[sortKey]) - (x[sortKey] < y[sortKey])) * sortDir);

  const th = (k, t, n) => `<th data-k="${k}" class="${n ? "n" : ""}">${t}${sortKey === k ? (sortDir > 0 ? " ▲" : " ▼") : ""}</th>`;
  const head = `<tr>${th("brand","品牌")}${th("title","產品")}${th("stock","庫存",1)}${th("inbound","在途",1)}${th("sales30","30天銷量",1)}${th("days","可售天數",1)}${th("price","均價",1)}<th>${tab === "all" ? "發貨" : "發貨量"}</th><th>備註</th>${tab === "all" ? "" : "<th>操作</th>"}</tr>`;
  const rows = list.map(r => {
    const s = st(r.asin), shipping = s.ship && !s.done;
    const act = tab === "all" ? "" : tab === "ship"
      ? `<td><button class="primary" data-a="done" data-id="${esc(r.asin)}">✓ 已發貨</button></td>`
      : `<td><button data-a="undo" data-id="${esc(r.asin)}">還原</button></td>`;
    const shipCell = tab === "all"
      ? (shipping ? `<span class="pill warn">需發貨 ${s.qty || ""}</span> <button data-a="cancel" data-id="${esc(r.asin)}">取消</button>` : s.done ? `<span class="pill ok">已發貨</span>` : `<button data-a="ship" data-id="${esc(r.asin)}">標記需發貨</button>`)
      : `<b>${s.qty || "—"}</b><div class="meta">通知：${esc(s.reqAt || "—")} ${esc(s.reqBy || "")}</div>` + (tab === "done" ? `<div class="meta"><b>發貨：${esc(s.doneAt || "—")}</b> ${esc(s.doneBy || "")}</div>` : "");
    return `<tr class="${shipping ? "ship" : ""}"><td>${esc(r.brand)}</td>
      <td class="title"><a href="${AMAZON}${esc(r.asin)}" target="_blank" rel="noopener">${esc(r.title)}</a><small>${esc(r.asin)}${r.msku ? " · " + esc(r.msku) : ""}</small></td>
      <td class="n">${r.stock == null ? "—" : r.stock.toLocaleString()}</td><td class="n">${r.inbound == null ? "—" : r.inbound.toLocaleString()}</td><td class="n">${r.sales30.toLocaleString()}</td>
      <td class="n">${pill(r.days)}</td><td class="n">$${r.price.toFixed(2)}</td><td>${shipCell}</td>
      <td><textarea data-id="${esc(r.asin)}" placeholder="留言…">${esc(s.comment || "")}</textarea></td>${act}</tr>`;
  }).join("");
  $("#tbl").innerHTML = head + (rows || `<tr><td class="empty" colspan="10">${tab === "ship" ? "目前沒有待發貨項目" : "沒有符合的資料"}</td></tr>`);
}

// ===== 事件 =====
$("#tabs").onclick = e => { const t = e.target.closest("button"); if (!t) return; tab = t.dataset.t; [...$("#tabs").children].forEach(x => x.classList.toggle("on", x === t)); render(); };
["#q", "#brand", "#low"].forEach(s => $(s).oninput = render);
$("#tbl").onclick = e => {
  const th = e.target.closest("th[data-k]"); if (th) { const k = th.dataset.k; sortDir = sortKey === k ? -sortDir : 1; sortKey = k; return render(); }
  const bt = e.target.closest("button[data-a]"); if (!bt) return;
  const id = bt.dataset.id, a = bt.dataset.a;
  if (a === "ship") { const v = prompt("需要發貨數量？"); if (v === null) return; patch(id, {ship: true, done: false, qty: num(v)}); }
  if (a === "cancel") patch(id, {ship: false, qty: 0});
  if (a === "done") patch(id, {done: true});
  if (a === "undo") patch(id, {done: false, ship: true});
  render();
};
$("#tbl").addEventListener("change", e => { if (e.target.matches("textarea")) patch(e.target.dataset.id, {comment: e.target.value}); });
$("#who").value = ls("who") || ""; $("#who").onchange = () => ls("who", $("#who").value);
$("#themeBtn").onclick = () => { const d = document.documentElement, dark = getComputedStyle(d).getPropertyValue("--bg").trim() === "#151a18"; d.dataset.theme = dark ? "light" : "dark"; };
setInterval(async () => { if (SYNC_URL && !document.activeElement.matches("textarea")) { await loadState(); render(); } }, 60000);
load();
</script>
</body>
</html>
